[package]
name = "picturesque-marks"
version = "0.4.0"
edition = "2024"
description = "Generate SVG icons from tag strings and sketchy underlines from seeds."
license = "MIT"
readme = "README.md"
repository = "https://github.com/sosuisen/picturesque-marks"
keywords = ["svg", "icon", "identicon", "design", "generator"]
categories = ["multimedia::images"]
exclude = ["gallery.html", "swatches.html"]

[dependencies]
rand = "0.10"
rand_pcg = "0.10.2"
sha2 = "0.11"
